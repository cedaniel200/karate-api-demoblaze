plugins {
    id 'java'
}

group = 'com.cedaniel200'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    karateVersion = '1.5.2'
    junitPlatformVersion = '1.11.4'
}

sourceSets {
    test {
        resources {
            srcDirs = ['src/test/resources', 'src/test/java']
            exclude '**/*.java'
        }
    }
}

dependencies {
    testImplementation "io.karatelabs:karate-junit5:$karateVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitPlatformVersion"
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'karate.env', System.getProperty('karate.env', 'dev')
    def karateOptions = System.getProperty('karate.options')
    if (karateOptions) {
        systemProperty 'karate.options', karateOptions
    }
    outputs.upToDateWhen { false }
}

tasks.register('karateExecute', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.intuit.karate.cli.Main'
}
